function citeCard() {
  var q = QUOTES[Math.floor(Math.random()*QUOTES.length)]
  var hh = HADITHS[Math.floor(Math.random()*HADITHS.length)]
  var out = '<div class="cite-card" style="padding:.65rem .85rem">'
  out += '<p style="font-size:.78rem;color:#34d399;line-height:1.5;font-style:italic">"' + q.text + '"'
  if(q.author) { out += '<br><span style="font-size:.65rem;color:#4b5563">\u2014 ' + q.author + '</span>' }
  out += '</p><div style="height:1px;background:rgba(16,185,129,.1);margin:.5rem 0"></div>'
  out += '<p style="font-size:.75rem;color:#93c5fd;line-height:1.4">\ufdfa ' + hh.text + '</p></div>'
  return out
}

var respPhases = [["Inspire",3,"#17B8A6"],["Retiens",5,"#E3B25C"],["Expire",7,"#7FA6D8"]];
var respT = null, respP = 0, respReste = 3, respCycles = 0;

function respStart(){
  if(respT){ return; }
  respP = 0; respReste = respPhases[0][1]; respCycles = 0;
  respT = setInterval(respTic, 1000);
  respPeindre();
}
function respStop(){
  if(respT){ clearInterval(respT); respT = null; }
  respPeindre();
}
function respTic(){
  if(!document.getElementById('resp-num')){ respStop(); return; }   // on a quitté l'écran
  respReste--;
  if(respReste <= 0){
    respP++;
    if(respP >= respPhases.length){ respP = 0; respCycles++; }
    respReste = respPhases[respP][1];
  }
  respPeindre();
}
function respPeindre(){
  var n = document.getElementById('resp-num'); if(!n){ return; }
  var ph = respPhases[respP];
  n.textContent = respReste;
  document.getElementById('resp-phase').textContent = ph[0];
  document.getElementById('resp-phase').style.color = ph[2];
  document.getElementById('resp-cercle').style.borderColor = ph[2];
  document.getElementById('resp-cercle').style.boxShadow = "0 0 40px " + ph[2] + "55";
  document.getElementById('resp-cycles').textContent = respCycles;
  var b = document.getElementById('resp-btn');
  if(b){ b.textContent = respT ? "Arrêter" : "Commencer"; }
}

var ti = 0, trep = {};
function selPorte(i, v){
  trep[i] = v; ti = i + 1;
  if(ti >= QUESTIONS_PORTES.length){ return finTestPortes(); }
  renderPortes();
}
function finTestPortes(){
  var acc = {}, cnt = {};
  for(var i=0;i<QUESTIONS_PORTES.length;i++){
    var k = QUESTIONS_PORTES[i].p, v = trep[i] || 0;
    acc[k] = (acc[k] || 0) + v; cnt[k] = (cnt[k] || 0) + 1;
  }
  var moy = [];
  for(var j=0;j<PORTES.length;j++){
    var id = PORTES[j].id;
    moy.push({ id:id, score:Math.round(((acc[id]||0) / (cnt[id]||1)) * 10) / 10 });
  }
  moy.sort(function(a,b){ return b.score - a.score; });
  SS('nafs_portes', { date:new Date().toISOString().slice(0,10), classement:moy });
  ti = 0; trep = {};
  toast('✅ Tes portes sont calculées');
  nav('maPorte');
}

/* ---- le pacte de 40 jours ---- */
function pacte(){ return S('nafs_pacte', null); }
function jourCourantPacte(p){
  if(!p){ return 0; }
  var d1 = new Date(p.debut + 'T00:00:00');
  var d2 = new Date();
  var n = Math.floor((d2 - d1) / 86400000) + 1;
  return (n < 1 || n > 40) ? (n < 1 ? 1 : 41) : n;
}
function demarrerPacte(porteId, regle){
  var p = porteById(porteId);
  SS('nafs_pacte', { porte:porteId, regle:regle || (p ? p.regle : ''), debut:new Date().toISOString().slice(0,10), jours:[] });
  toast('✅ Pacte commencé — 40 jours');
  nav('pacte');
}
function basculeJour(n){
  var p = pacte(); if(!p){ return; }
  var i = p.jours.indexOf(n);
  if(i >= 0){ p.jours.splice(i, 1); } else { p.jours.push(n); }
  SS('nafs_pacte', p); renderPacte();
}
function seriePacte(p){
  if(!p || !p.jours.length){ return 0; }
  var j = p.jours.slice().sort(function(a,b){ return a-b; });
  return j[j.length - 1];
}

// =====================================================================
// LE CORAN — le pilier القَلْب (Qalb)
// L'essentiel de Hifz Sentinel, dans l'application : lire, écouter,
// répéter, tester de mémoire, et suivre ce qu'on a appris.
// Source : api.alquran.cloud — aucune donnée ne quitte le téléphone.
// =====================================================================

var coranListe = S('coran_liste', null);
var coranData = null, coranS = 0, coranEnChargement = false, coranErreur = "";
var coranAudio = null, coranIdx = 0, coranCompte = 0;

function coranReglages(){
  var r = S('coran_reglages', null);
  if(!r){ r = { trad:true, masque:false, rep:1 }; }
  return r;
}
function coranSetReglages(patch){
  var r = coranReglages();
  for(var k in patch){ r[k] = patch[k]; }
  SS('coran_reglages', r);
  renderSourate();
}
function coranApprises(){ return S('coran_apprises', []); }
function coranEstApprise(n){ return coranApprises().indexOf(n) >= 0; }
function coranBasculerApprise(n){
  var a = coranApprises(), i = a.indexOf(n);
  if(i >= 0){ a.splice(i, 1); toast('Retirée des sourates apprises'); }
  else { a.push(n); a.sort(function(x,y){ return x-y; }); toast('✅ Sourate marquée comme apprise'); }
  SS('coran_apprises', a);
  renderSourate();
}
function sourateDuJour(){
  var d = new Date();
  var n = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  return (n % 114) + 1;
}

function coranChargerListe(){
  if(coranListe){ return; }
  coranErreur = "";
  fetch('https://api.alquran.cloud/v1/surah')
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d && d.status === 'OK' && d.data){ coranListe = d.data; SS('coran_liste', d.data); }
      else { coranErreur = "Réponse inattendue de la source."; }
      renderCoran();
    })
    .catch(function(){ coranErreur = "Pas de connexion — la liste se chargera à la prochaine ouverture."; renderCoran(); });
}

function coranChargerSourate(n){
  coranS = n; coranEnChargement = true; coranData = null; coranErreur = "";
  renderSourate();
  fetch('https://api.alquran.cloud/v1/surah/' + n + '/editions/quran-uthmani,fr.hamidullah,ar.alafasy')
    .then(function(r){ return r.json(); })
    .then(function(d){
      coranEnChargement = false;
      if(!d || d.status !== 'OK' || !d.data){ coranErreur = "Impossible de charger cette sourate."; renderSourate(); return; }
      var ar = null, fr = null, au = null;
      for(var i=0;i<d.data.length;i++){
        var id = d.data[i].edition.identifier;
        if(id === 'quran-uthmani'){ ar = d.data[i]; }
        else if(id === 'fr.hamidullah'){ fr = d.data[i]; }
        else if(id === 'ar.alafasy'){ au = d.data[i]; }
      }
      coranData = { n:n, ar:ar, fr:fr, au:au };
      SS('coran_derniere', { s:n, t:Date.now() });
      renderSourate();
    })
    .catch(function(){
      coranEnChargement = false;
      coranErreur = "Pas de connexion. Le texte du Coran se charge depuis internet — réessaie quand tu as du réseau.";
      renderSourate();
    });
}

/* ---- l'écoute ---- */
function coranArreter(){
  if(coranAudio){ try { coranAudio.pause(); coranAudio = null; } catch(e){} }
  var l = document.querySelectorAll('.ayah.on');
  for(var i=0;i<l.length;i++){ l[i].classList.remove('on'); }
}
function coranJouer(i){
  if(!coranData || !coranData.au || !coranData.au.ayahs[i]){ return; }
  coranArreter();
  coranIdx = i; coranCompte = 0;
  coranJouerUne(i);
}
function coranJouerUne(i){
  var ay = coranData.au.ayahs[i];
  if(!ay || !ay.audio){ return; }
  var el = document.getElementById('ay' + i);
  if(el){ el.classList.add('on'); }
  coranAudio = new Audio(ay.audio);
  coranAudio.onended = function(){
    coranCompte++;
    var rep = coranReglages().rep;
    if(rep === 0 || coranCompte < rep){ coranJouerUne(i); return; }
    if(i + 1 < coranData.au.ayahs.length){ coranJouer(i + 1); }
    else { coranArreter(); if(el){ el.classList.remove('on'); } }
  };
  coranAudio.play().catch(function(){});
}

// LA MARCHE JAPONAISE — le minuteur
// 3 min RAPIDE / 3 min MODÉRÉE, 7 fois = 45 minutes.
// (Interval Walking Training — professeur Hiroshi Nose, université de Shinshu)
// =====================================================================

var MAR_RAPIDE = 180, MAR_MOD = 180, MAR_CYCLES = 7;   /* 7×6 + 3 = 45 min */
var marT = null, marSeq = [], marI = 0, marReste = 0, marActif = false, marFini = false;
var marEcoule = 0;

function marSequence(){
  var s = [];
  for(var c = 0; c < MAR_CYCLES; c++){ s.push("rapide"); s.push("moderee"); }
  s.push("rapide");                       /* la dernière accélération : 45 min pile */
  return s;
}
function marPhaseLabel(p){ return p === "rapide" ? "RAPIDE" : "MODÉRÉE"; }
function marPhaseCouleur(p){ return p === "rapide" ? "#ef4444" : "#10b981"; }
function marPhaseDuree(p){ return p === "rapide" ? MAR_RAPIDE : MAR_MOD; }
function marCycleActuel(){ return Math.min(MAR_CYCLES, Math.floor(marI / 2) + 1); }

function bip(freq, duree){
  try {
    var C = window.AudioContext || window.webkitAudioContext; if(!C){ return; }
    if(!window._actx){ window._actx = new C(); }
    var a = window._actx, o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = freq || 880;
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, a.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + (duree || 0.18));
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + (duree || 0.2));
  } catch(e){}
}
function vibre(ms){ if(navigator.vibrate){ try { navigator.vibrate(ms || 120); } catch(e){} } }

function marDemarrer(){
  if(marActif){ return; }
  if(marFini || !marSeq.length){ marSeq = marSequence(); marI = 0; marEcoule = 0; marFini = false; }
  marReste = marPhaseDuree(marSeq[marI]);
  marActif = true;
  bip(880, 0.2); vibre(200);
  marT = setInterval(marTic, 1000);
  marPeindre();
}
function marPause(){
  marActif = false;
  if(marT){ clearInterval(marT); marT = null; }
  marPeindre();
}
function marStop(){
  marPause(); marSeq = []; marI = 0; marEcoule = 0; marFini = false;
  marSeq = marSequence(); marReste = marPhaseDuree(marSeq[0]);
  marPeindre();
}
function marTic(){
  if(!document.getElementById('mar-num')){ marPause(); return; }   /* on a quitté l'écran */
  marReste--; marEcoule++;
  if(marReste <= 0){
    marI++;
    if(marI >= marSeq.length){
      marActif = false;
      if(marT){ clearInterval(marT); marT = null; }
      marFini = true;
      bip(1200, 0.4); vibre(500);
      marPeindre();
      return;
    }
    marReste = marPhaseDuree(marSeq[marI]);
    bip(marSeq[marI] === "rapide" ? 1000 : 700, 0.3);
    vibre(300);
  }
  marPeindre();
}
function marfmt(s){
  var m = Math.floor(s / 60), r = s % 60;
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function marPeindre(){
  var n = document.getElementById('mar-num'); if(!n){ return; }
  var total = 45 * 60;
  var reste = Math.max(0, total - marEcoule);
  var ph = marActif ? marSeq[marI] : null;
  n.textContent = marfmt(marReste);
  document.getElementById('mar-phase').textContent = marFini ? "TERMINÉ" : (ph ? marPhaseLabel(ph) : "PRÊT");
  var coul = marFini ? "#d9b26a" : (ph ? marPhaseCouleur(ph) : "#6b7280");
  document.getElementById('mar-phase').style.color = coul;
  document.getElementById('mar-cercle').style.borderColor = coul;
  document.getElementById('mar-cercle').style.boxShadow = "0 0 46px " + coul + "55";
  document.getElementById('mar-consigne').textContent = marFini
    ? "45 minutes. C'est fait."
    : (ph === "rapide" ? "Marche vite, souffle fort — tu dois pouvoir parler, pas chanter."
                       : "Ralentis, respire — récupère pour l'accélération suivante.");
  document.getElementById('mar-cycle').textContent = marFini ? MAR_CYCLES : marCycleActuel();
  document.getElementById('mar-ecoule').textContent = marfmt(marEcoule);
  document.getElementById('mar-reste').textContent = marfmt(reste);
  var pct = Math.round(marEcoule * 100 / total);
  var bar = document.getElementById('mar-bar');
  if(bar){ bar.style.width = pct + "%"; }
  var b = document.getElementById('mar-btn');
  if(b){ b.textContent = marActif ? "⏸ Pause" : (marFini ? "Recommencer" : "▶ Commencer"); }
}

function renderMarche(){
  const el = document.getElementById('pc'); if(!el) return
  if(!marSeq.length){ marSeq = marSequence(); }
  if(!marActif && !marFini && marReste <= 0){ marI = 0; marReste = marPhaseDuree(marSeq[0]); }
  const ph = marActif ? marSeq[marI] : null;
  const coul = marFini ? "#d9b26a" : (ph ? marPhaseCouleur(ph) : "#6b7280");
  el.innerHTML = `
    <button class="btn btn-outline btn-sm" style="margin:0 0 .75rem" onclick="marPause();nav('savoir')">‹ Retour au Savoir</button>

    <p style="font-size:.82rem;color:#6b7280;line-height:1.6;margin-bottom:1rem">
      3 minutes RAPIDE, 3 minutes MODÉRÉE, et on recommence — <b style="color:#9ca3af">7 fois = 45 minutes</b>.
      La méthode du professeur Hiroshi Nose (université de Shinshu, Japon) : l'alternance entraîne le cœur
      mieux qu'une marche continue. C'est la mission du <b style="color:#9ca3af">jour 11</b>.
    </p>

    <div class="card" style="text-align:center;padding:1.4rem 1rem">
      <div id="mar-cercle" style="width:180px;height:180px;border-radius:50%;border:4px solid ${coul};
           margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
           transition:border-color .4s, box-shadow .4s">
        <div id="mar-phase" style="font-size:.72rem;letter-spacing:2px;font-weight:800;color:${coul}">PRÊT</div>
        <div id="mar-num" style="font-size:2.9rem;font-weight:800;line-height:1.15">3:00</div>
        <div style="font-size:.68rem;color:#6b7280">cycle <b id="mar-cycle">1</b> / ${MAR_CYCLES}</div>
      </div>
      <div id="mar-consigne" style="font-size:.82rem;color:#9ca3af;margin-top:.9rem;line-height:1.5"></div>
      <div style="display:flex;gap:.5rem;justify-content:center;margin-top:1.1rem">
        <button id="mar-btn" class="btn btn-primary" style="min-width:150px" onclick="marActif ? marPause() : marDemarrer()">▶ Commencer</button>
        <button class="btn btn-outline" onclick="marStop()">■ Stop</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;font-size:.78rem;color:#9ca3af;margin-bottom:.45rem">
        <span>Écoulé : <b id="mar-ecoule" style="color:#e5e7eb">0:00</b></span>
        <span>Reste : <b id="mar-reste" style="color:#e5e7eb">45:00</b></span>
      </div>
      <div style="height:6px;background:rgba(255,255,255,.07);border-radius:99px">
        <div id="mar-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#10b981,#ef4444);border-radius:99px;transition:width .4s"></div>
      </div>
      <div style="display:flex;gap:.5rem;margin-top:.9rem">
        <button class="btn btn-outline btn-sm" style="flex:1" onclick="bip(880,0.2)">🔔 Tester le signal</button>
        <button class="btn btn-outline btn-sm" style="flex:1" onclick="marSeq=[];marI=0;marEcoule=0;marFini=false;marReste=0;renderMarche()">Réinitialiser</button>
      </div>
      <p style="font-size:.72rem;color:#6b7280;margin:.7rem 0 0;line-height:1.5">
        Le signal sonore et la vibration te préviennent à chaque changement de rythme : garde le téléphone
        dans la poche ou à la main, et n'écoute pas de musique. Compte 7 cycles.</p>
    </div>

    <div class="card">
      <div style="font-weight:700;font-size:.88rem;margin-bottom:.5rem">Comment marcher</div>
      <div style="font-size:.84rem;line-height:1.7;color:#d1d5db">
        <p style="margin:0 0 .5rem"><b style="color:#ef4444">RAPIDE</b> — tu marches vite, le souffle s'accélère, mais tu peux encore parler. Pas de course.</p>
        <p style="margin:0 0 .5rem"><b style="color:#10b981">MODÉRÉE</b> — tu ralentis, tu récupères. C'est ce qui permet d'enchaîner 45 minutes sans t'épuiser.</p>
        <p style="margin:0">Sept cycles, sans t'arrêter. Si tu débutes : commence par 3 cycles (18 minutes) et ajoute un cycle chaque semaine.</p>
      </div>
    </div>
    <p style="font-size:.72rem;color:#4b5563;line-height:1.6">Méthode : Interval Walking Training — Pr Hiroshi Nose et Dr Shizue Masuki, université de Shinshu (Japon). Pas un avis médical : si tu as un souci cardiaque ou un doute, demande à ton médecin.</p>`
  marPeindre();
}

    <div style="display:flex;justify-content:space-between;align-items:center;padding:.5rem 0">
      <h2 style="font-size:1.1rem;font-weight:700;letter-spacing:-.01em">Jour <span style="color:#10b981">${d}</span>/30</h2>
      <div style="display:flex;align-items:center;gap:.5rem"><span style="font-size:.75rem;color:#6b7280">${done}/${total}</span><div class="progress-bar" style="width:60px"><div class="progress-fill" style="width:${pct}%"></div></div></div>
    </div>
    <div style="display:flex;gap:.3rem;margin-bottom:1rem;overflow-x:auto;padding:.25rem 0;flex-wrap:wrap">
      ${Array.from({length:30},(_,i)=>{const x=i+1,al=(state.progress[x]?.c?.length||0)>=4;return `<button class="day-btn ${x===d?'active':al?'done':''}" onclick="goDay(${x})">${x}</button>`}).join('')}
    </div>
    ${BRIEFINGS[d]?`<div class="card" style="margin-bottom:.75rem;background:rgba(16,185,129,.04);border-color:rgba(16,185,129,.15)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
        <span style="font-weight:600;font-size:.85rem;color:#34d399;display:flex;align-items:center;gap:.35rem">${ICONS.book} Briefing — Jour ${d}</span>
        ${!briefingDone?`<button class="btn btn-primary btn-sm" onclick="markBrief(${d})">✅ Lu</button>`:`<span style="color:#10b981;font-size:.8rem">✅ Lu</span>`}
      </div>
      <p style="font-size:.85rem;line-height:1.7;color:#d1d5db">${BRIEFINGS[d]}</p>
    </div>`:''}
    <h3 style="font-size:.95rem;font-weight:600;margin-bottom:.5rem">Missions du jour</h3>
    ${missions.map(m=>{const is=completed.includes(m.t);return `<div class="card" style="margin-bottom:.5rem;${is?'opacity:.5':''}"><div style="display:flex;justify-content:space-between;align-items:start;gap:.5rem"><div><span class="badge" style="font-size:.65rem;background:${m.p==='Djism'?'rgba(239,68,68,.15)':m.p==='Aql'?'rgba(59,130,246,.15)':m.p==='Nafs'?'rgba(245,158,11,.15)':'rgba(16,185,129,.15)'};color:${m.p==='Djism'?'#fca5a5':m.p==='Aql'?'#93c5fd':m.p==='Nafs'?'#fbbf24':'#34d399'}">${m.p}</span><div style="font-weight:600;font-size:.9rem;margin-top:.2rem">${m.t}</div><div style="font-size:.8rem;color:#6b7280">${m.d}</div></div><button class="btn btn-sm ${is?'btn-outline':'btn-primary'}" ${is?'disabled':''} onclick="compMission(${d},'${m.t}')">${is?'✅':'✓'}</button></div></div>`}).join('')}
    ${d===30 && done===4 ? `<div style="text-align:center;padding:1rem;margin:1rem 0;background:rgba(16,185,129,.06);border-radius:16px;border:1px solid rgba(16,185,129,.15)">
      <div style="font-size:1.5rem;font-weight:800;color:#34d399;margin-bottom:.25rem">🎉 Protocole terminé !</div>
      <p style="font-size:.85rem;color:#6b7280;line-height:1.6;margin-bottom:1rem">Félicitations ! 30 jours de transformation.<br>Mesure ta progression avec un nouveau diagnostic.</p>
      <button class="btn btn-primary btn-sm" onclick="retakeDiag()">📊 Re-test diagnostic</button>
    </div>` : ''}
    <div style="display:flex;justify-content:center;gap:.75rem;margin-top:1rem;padding:.5rem">
      <div style="text-align:center">
        <p style="font-size:.7rem;color:#6b7280;margin-bottom:.25rem">SOS</p>
        <button class="btn btn-danger btn-sm" onclick="triggerSos(${d})" style="border-radius:50%;width:44px;height:44px;font-size:1rem;padding:0">${sosCount>0?sosCount:'SOS'}</button>
        <p style="font-size:.65rem;color:#4b5563;margin-top:.2rem">${sosCount>0?'×'+sosCount:'Appel à la force'}</p>
      </div>
      <div style="text-align:center">
        <p style="font-size:.7rem;color:#6b7280;margin-bottom:.25rem">Progression</p>
        <div style="font-size:1.1rem;font-weight:700;color:#10b981">${totalDone}/120</div>
        <p style="font-size:.65rem;color:#4b5563;margin-top:.2rem">missions faites</p>
      </div>
    </div>`
}

function goDay(d){state.currentDay=d;save();renderProto()}
function activatePack(){state.packActive=true;state.currentDay=1;state.progress={};save();toast('✅ Protocole 30J activé !');nav('proto')}
function compMission(d,t){
  if(!state.progress[d])state.progress[d]={c:[]}
  if(!state.progress[d].c.includes(t))state.progress[d].c.push(t)
  state.currentDay=Math.max(state.currentDay,d);save();toast('✅ Mission accomplie ! 🎯');renderProto()
}
function markBrief(d){if(!state.progress[d])state.progress[d]={c:[]};state.progress[d].b=true;save();toast('✅ Briefing lu');renderProto()}
function triggerSos(d){
  if(!state.progress[d])state.progress[d]={c:[]};
  state.progress[d].s=(state.progress[d].s||0)+1;
  save();
  showSosOverlay(randomSos());
  renderProto()
}
function showSosOverlay(msg){
  var old=document.querySelector('.sos-overlay'); if(old) old.remove()
  var ov=document.createElement('div'); ov.className='sos-overlay'
  var hasSource=msg.indexOf(' - ') > -1
  var textPart = hasSource ? msg.split(' - ')[0] : msg
  var sourcePart = hasSource ? msg.split(' - ')[1] : ''
  ov.innerHTML='<button class="sos-close" onclick="document.querySelector(\'.sos-overlay\')?.remove()">✕</button><div style="text-align:center;margin-bottom:.5rem"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><circle cx="12" cy="16" r="0.5" fill="#ef4444"/></svg></div><div style="text-align:center;margin-bottom:1.5rem"><span style="font-size:.75rem;font-weight:600;letter-spacing:2px;color:#ef4444;text-transform:uppercase">SOS — Rappel de force</span></div><div id="sos-phase1"><div class="sos-text">'+textPart+'</div>'+(sourcePart?'<div style="text-align:center;max-width:480px;margin:0 auto">'+(VERSET_AR[sourcePart]?'<div style="background:rgba(255,255,255,.03);border-radius:16px;padding:1rem 1.25rem;margin-bottom:.5rem;border:1px solid rgba(255,255,255,.06);direction:rtl"><p style="font-size:1.3rem;line-height:2;color:#d4e5ff;font-family:serif;text-align:center">'+VERSET_AR[sourcePart].ar+'</p><p style="font-size:.8rem;color:#6b7280;text-align:center;margin-top:.5rem;direction:ltr">'+VERSET_AR[sourcePart].fr+'</p></div>':'')+'<div class="sos-source" style="text-align:center">— '+sourcePart+'</div></div>':'')+'</div><div id="sos-phase2" style="display:none" class="breath-container"><div class="breath-circle" style="animation-duration:30s"><div class="breath-circle-inner">﷽</div></div><div id="breath-label" class="breath-label">Inspire...</div><div class="breath-sub">5 secondes</div><div class="breath-phase"><span id="bp-in" class="on">⬆ Inspire 5s</span><span id="bp-out">⬇ Expire 5s</span></div><div id="breath-count" class="breath-count">Cycle 1/3</div></div>'
  document.body.appendChild(ov)
  // Phase 1 : citation 4s, puis respiration
  setTimeout(function(){
    var p1=document.getElementById('sos-phase1'); if(p1)p1.style.display='none'
    var p2=document.getElementById('sos-phase2'); if(p2)p2.style.display='block'
    var label=document.getElementById('breath-label')
    if(!label||!p2) return
    var idx=0, cycle=0
    // Alterne Inspire/Expire toutes les 5s
    var breathTick=setInterval(function(){
      idx++
      if(idx%2==1){
        label.textContent='Expire...'; label.style.color='#93c5fd'
        document.getElementById('bp-in')?.classList.remove('on')
        document.getElementById('bp-out')?.classList.add('on')
        cycle++
        var cc=document.getElementById('breath-count')
        if(cc) cc.textContent='Cycle '+(cycle+1)+'/3'
      } else {
        label.textContent='Inspire...'; label.style.color='#10b981'
        document.getElementById('bp-in')?.classList.add('on')
        document.getElementById('bp-out')?.classList.remove('on')
      }
    }, 5000)
    // Timer 1seconde pour le compte à rebours
    var secLabel=label.nextElementSibling
    var breathSec=setInterval(function(){
      if(secLabel&&secLabel.className=='breath-sub'){
        var s=parseInt(secLabel.textContent)
        if(s>0) secLabel.textContent=s-1+' secondes'
        else secLabel.textContent='5 secondes'
      }
    }, 1000)
    // Fin après 30s
    setTimeout(function(){
      clearInterval(breathTick)
      clearInterval(breathSec)
      if(p2) p2.innerHTML='<div style="text-align:center;padding:1rem"><div style="font-size:1.2rem;font-weight:700;color:#34d399;margin-bottom:.5rem">Calme retrouvé 🤲</div><p style="font-size:.85rem;color:#6b7280;line-height:1.6">Prends ce calme avec toi.<br>Tu es plus fort que tu ne le crois.</p><button class="btn btn-primary btn-sm" style="margin-top:1rem" onclick="document.querySelector(\'.sos-overlay\')?.remove()">Continuer</button></div>'
    }, 30000)
  }, 12000)
  // Fermeture auto après 38s
  setTimeout(function(){
    var e=document.querySelector('.sos-overlay')
    if(e&&!e.querySelector('button[onclick*="Continuer"]')) e.remove()
  }, 46000)
}

// ========================== REPORT ==========================
function renderReport() {
  const el=document.getElementById('pc'); if(!el)return
  if(!state.scores||!state.packActive){el.innerHTML=`<div style="text-align:center;padding:2rem;color:#6b7280"><p>Fais d'abord le diagnostic et lance le protocole.</p><button class="btn btn-primary btn-sm" style="margin-top:.75rem" onclick="nav('diag')">Test diagnostic</button></div>`;return}
  let tm=0,td=0,ts=0
  for(let d=1;d<=30;d++){const g=state.progress[d];tm+=4;td+=g?.c?.length||0;ts+=g?.s||0}
  const r=tm>0?Math.round(td/tm*100):0
  el.innerHTML=`<h2 style="font-size:1.2rem;font-weight:700;text-align:center;margin:1rem 0;display:flex;align-items:center;justify-content:center;gap:.35rem">${ICONS.report}<span style="margin-left:.35rem">Rapport 30 jours</span></h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1rem">
      <div class="card" style="text-align:center"><div style="font-size:1.5rem;font-weight:700;color:#10b981">${td}</div><div style="font-size:.75rem;color:#6b7280">Missions sur ${tm}</div></div>
      <div class="card" style="text-align:center"><div style="font-size:1.5rem;font-weight:700;color:#fbbf24">${r}%</div><div style="font-size:.75rem;color:#6b7280">Complétion</div></div>
      <div class="card" style="text-align:center"><div style="font-size:1.5rem;font-weight:700;color:#fca5a5">${ts}</div><div style="font-size:.75rem;color:#6b7280">SOS utilisés</div></div>
      <div class="card" style="text-align:center"><div style="font-size:1.5rem;font-weight:700;color:#93c5fd">${Math.floor(td/4)}</div><div style="font-size:.75rem;color:#6b7280">Jours complétés</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">${pCard('Djism','💪','#ef4444',state.scores.Djism)}${pCard('Aql','🧠','#3b82f6',state.scores.Aql)}${pCard('Nafs','🔥','#f59e0b',state.scores.Nafs)}${pCard('Qalb','💚','#10b981',state.scores.Qalb)}</div>
    <p style="text-align:center;font-size:.85rem;color:#6b7280;margin:1.5rem 0;line-height:1.6">"${state.user?.name}, 30 jours de travail sur toi-même.<br>Chaque pas comptait. Chaque effort avait du sens.<br>Qu'Allah bénisse ton chemin. 🤲"</p>
    <div style="text-align:center"><button class="btn btn-outline btn-sm" onclick="nav('home')">← Accueil</button></div>`
}

// ========================== INIT ==========================
state.scores=S('scores',null)
render()
</script>
